name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore av1rt.slnx

      - name: Build
        run: dotnet build av1rt.slnx -c Release --no-restore

      - name: Test the SIPSorcery adapter
        run: dotnet test tests/SIPSorceryMedia.AV1.Tests/SIPSorceryMedia.AV1.Tests.csproj -c Release --no-build

      - name: Test av1rt (managed)
        run: dotnet test tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release --no-build --filter "Category!=Native&Category!=EndToEnd"

      # The differential and end-to-end tests run libaom itself: native shims linking the pure-C
      # libaom at tools/oracle/libaom.commit, the oracle encoder and aomdec. They are built here
      # from the official sources (never committed) and cached until the pinned commit or the
      # oracle build changes.
      - name: Restore the libaom tools
        id: shims
        uses: actions/cache/restore@v6
        with:
          path: |
            .oracle/shims
            .oracle/oracle/Release/av1rt_oracle.exe
            .oracle/build/Release/aomdec.exe
          key: libaom-tools-${{ hashFiles('tools/oracle/libaom.commit', 'tools/oracle/*.ps1', 'tools/oracle/CMakeLists.txt', 'tools/oracle/av1rt_oracle.c', 'tools/oracle/shim/**') }}

      - name: Fetch libaom
        if: steps.shims.outputs.cache-hit != 'true'
        env:
          AOM_ROOT: ${{ runner.temp }}\aom
        run: |
          $sha = (Get-Content tools/oracle/libaom.commit -TotalCount 1).Trim()
          git init -q $env:AOM_ROOT
          git -C $env:AOM_ROOT fetch -q --depth 1 https://aomedia.googlesource.com/aom $sha
          if ($LASTEXITCODE) { git -C $env:AOM_ROOT fetch -q --depth 1 https://github.com/m-ab-s/aom $sha }
          if ($LASTEXITCODE) { throw "cannot fetch libaom $sha" }
          git -C $env:AOM_ROOT checkout -q FETCH_HEAD
          if ($LASTEXITCODE) { throw "cannot check out libaom $sha" }

      - name: Build libaom and the shims
        if: steps.shims.outputs.cache-hit != 'true'
        env:
          AOM_ROOT: ${{ runner.temp }}\aom
        run: |
          ./tools/oracle/build.ps1
          ./tools/oracle/shim/build-shim.ps1 -All

      - name: Save the libaom tools
        if: steps.shims.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .oracle/shims
            .oracle/oracle/Release/av1rt_oracle.exe
            .oracle/build/Release/aomdec.exe
          key: ${{ steps.shims.outputs.cache-primary-key }}

      - name: Build the tests with the shims
        run: dotnet build tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release --no-restore

      - name: Test av1rt against libaom
        run: dotnet test tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release --no-build --filter "Category=Native"

      # End to end: whole encodes, byte-identical to the oracle's, on public Big Buck Bunny clips.
      # Only the one-second excerpts are cached; the clips and reference streams are made per run.
      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Restore the Big Buck Bunny excerpts
        id: bbb
        uses: actions/cache/restore@v6
        with:
          path: .testdata/bbb-*.mp4
          key: bbb-${{ hashFiles('tools/oracle/get-clips.ps1') }}

      - name: Make the clips
        run: ./tools/oracle/get-clips.ps1

      - name: Save the Big Buck Bunny excerpts
        if: steps.bbb.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .testdata/bbb-*.mp4
          key: ${{ steps.bbb.outputs.cache-primary-key }}

      - name: Make the oracle's reference streams
        shell: bash
        run: tools/oracle/make-refs.sh

      - name: Test av1rt end to end
        run: dotnet test tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release --no-build --filter "Category=EndToEnd&DisplayName~bbb"

  publish:
    name: Publish to NuGet
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025-vs2026
    environment: release
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing exchanges the GitHub OIDC token for a temporary key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/SIPSorceryMedia.AV1/SIPSorceryMedia.AV1.csproj   # and Av1rt, which it references

      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          foreach ($p in 'src/Av1rt/Av1rt.csproj', 'src/SIPSorceryMedia.AV1/SIPSorceryMedia.AV1.csproj') {
            dotnet pack $p -c Release --no-restore -o artifacts/nupkg "-p:Version=$version"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: lost   # the nuget.org account that created the trusted publishing policy (owner: Borg)

      - name: Push
        run: dotnet nuget push "artifacts/nupkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
