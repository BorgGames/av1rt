name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build av1rt.slnx -c Release

      - name: Test the SIPSorcery adapter
        run: dotnet test tests/SIPSorceryMedia.AV1.Tests/SIPSorceryMedia.AV1.Tests.csproj -c Release --no-build

      - name: Test av1rt (managed)
        run: dotnet test tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release --no-build --filter "Category!=Native&Category!=EndToEnd"

      # The differential tests call libaom itself through native shims linking the pure-C libaom
      # at tools/oracle/libaom.commit. They are built here from the official sources (never
      # committed) and cached until the pinned commit or the oracle build changes.
      - name: Restore the libaom shims
        id: shims
        uses: actions/cache/restore@v6
        with:
          path: .oracle/shims
          key: aomshims-${{ hashFiles('tools/oracle/libaom.commit', 'tools/oracle/*.ps1', 'tools/oracle/CMakeLists.txt', 'tools/oracle/shim/**') }}

      - name: Fetch libaom
        if: steps.shims.outputs.cache-hit != 'true'
        env:
          AOM_ROOT: ${{ runner.temp }}\aom
        run: |
          $sha = (Get-Content tools/oracle/libaom.commit -TotalCount 1).Trim()
          git init -q $env:AOM_ROOT
          git -C $env:AOM_ROOT fetch -q --depth 1 https://aomedia.googlesource.com/aom $sha
          if ($LASTEXITCODE) { git -C $env:AOM_ROOT fetch -q --depth 1 https://github.com/m-ab-s/aom $sha }
          if ($LASTEXITCODE) { throw "cannot fetch libaom $sha" }
          git -C $env:AOM_ROOT checkout -q FETCH_HEAD
          if ($LASTEXITCODE) { throw "cannot check out libaom $sha" }

      - name: Build libaom and the shims
        if: steps.shims.outputs.cache-hit != 'true'
        env:
          AOM_ROOT: ${{ runner.temp }}\aom
        run: |
          ./tools/oracle/build.ps1
          ./tools/oracle/shim/build-shim.ps1 -All

      - name: Save the libaom shims
        if: steps.shims.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .oracle/shims
          key: ${{ steps.shims.outputs.cache-primary-key }}

      - name: Build the tests with the shims
        run: dotnet build tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release

      - name: Test av1rt against libaom
        run: dotnet test tests/Av1rt.Tests/Av1rt.Tests.csproj -c Release --no-build --filter "Category=Native"

  publish:
    name: Publish to NuGet
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025-vs2026
    environment: release
    permissions:
      contents: read
      id-token: write   # NuGet trusted publishing exchanges the GitHub OIDC token for a temporary key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Pack
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          foreach ($p in 'src/Av1rt/Av1rt.csproj', 'src/SIPSorceryMedia.AV1/SIPSorceryMedia.AV1.csproj') {
            dotnet pack $p -c Release -o artifacts/nupkg "-p:Version=$version"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push "artifacts/nupkg/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
